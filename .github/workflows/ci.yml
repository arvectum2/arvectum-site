name: Site checks

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Repository invariants
        run: node scripts/check-repository.mjs

      - name: JavaScript syntax
        run: node scripts/check-js.mjs

      - name: Sitemap freshness
        run: node scripts/seo-generate-sitemap.mjs --check

      - name: Static site checks
        run: node scripts/check-static.mjs

      - name: Asset budget
        run: node scripts/check-assets.mjs

      - name: PHP syntax
        run: |
          php -l public/api/submit.php
          php -l public/api/cookie-consent.php
          php -l public/api/health.php
